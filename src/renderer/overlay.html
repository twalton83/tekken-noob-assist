<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="root" class="locked">
    <div id="dragbar">drag to position · <kbd>F4</kbd> locks</div>
    <div id="statusbar">
      <button id="mode-pill" title="Switch mode (F1)">FREEPLAY</button>
      <span id="side-pill">P1</span>
      <span id="opacity-pill">100%</span>
      <span id="pad-view"><span id="pad-dir">n</span><span id="pad-btns"></span></span>
      <svg id="conn" class="off" viewBox="0 0 24 24" width="15" height="15" aria-label="controller status">
        <path fill="currentColor" d="M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
      </svg>
      <span id="keys"></span>
    </div>

    <div id="freeplay">
      <div id="ticker"></div>
    </div>

    <div id="trainer" class="hidden">
      <div id="combo-head">
        <span id="combo-name"></span>
        <span id="combo-idx"></span>
        <span id="metro-pill" class="off">metronome</span>
      </div>
      <div id="combo-strip"></div>
      <div id="combo-note"></div>
      <div id="summary"></div>
      <div id="input-history"></div>
    </div>

    <div id="notation" class="hidden">
      <div id="nota-head">
        <span id="nota-diffs">
          <button class="nota-diff-btn" data-diff="easy" title="1 input (F2/F3 cycles)">easy</button>
          <button class="nota-diff-btn" data-diff="medium" title="2 inputs (F2/F3 cycles)">medium</button>
          <button class="nota-diff-btn" data-diff="hard" title="3 inputs (F2/F3 cycles)">hard</button>
        </span>
        <span id="nota-score"></span>
        <button id="nota-skip" title="New prompt (F8)">skip ›</button>
      </div>
      <div id="nota-prompt"></div>
      <div id="nota-progress"></div>
      <div id="nota-feedback"></div>
    </div>
  </div>
  <script type="module" src="../../dist/renderer/overlay.js"></script>
</body>
</html>
